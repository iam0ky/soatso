name: Solar dashboard
# Label each run in the Actions list by what started it
run-name: "Solar dashboard · ${{ github.event_name == 'schedule' && 'GitHub schedule' || inputs.source || 'manual' }}"

on:
  # GitHub's timer can run late or skip a run when it's busy, so each main run has a
  # backup 30 minutes later. Extra runs are harmless: they just refresh the dashboard;
  # the morning message is sent once a day and alerts only when something changes.
  schedule:
    # Times are in UTC (IST = UTC + 5:30). Odd minutes avoid GitHub's busiest times.
    - cron: "17 2 * * *"      # 02:17 UTC =  7:47 AM IST — morning start + resident update
    - cron: "47 2 * * *"      # 02:47 UTC =  8:17 AM IST — backup
    - cron: "17 8 * * *"      # 08:17 UTC =  1:47 PM IST — today so far
    - cron: "47 8 * * *"      # 08:47 UTC =  2:17 PM IST — backup
    - cron: "17 14 * * *"     # 14:17 UTC =  7:47 PM IST — full day + health check
    - cron: "47 14 * * *"     # 14:47 UTC =  8:17 PM IST — backup
  workflow_dispatch:           # "Run workflow" button
    inputs:
      source:
        description: "Who started this run"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write              # lets the job commit the dashboard

concurrency:
  group: solar-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # History is kept in the Actions cache, NOT committed to this public repo.
      # If the cache is ever cleared, the script simply re-downloads history from Deye.
      - name: Restore private history
        uses: actions/cache/restore@v4
        with:
          path: data
          key: solar-data-${{ github.run_id }}
          restore-keys: solar-data-

      # Optional permanent backup in a PRIVATE repo (Variable DATA_REPO + Secret DATA_REPO_TOKEN).
      # Fills in any file the cache doesn't have — e.g. if the cache was cleared.
      - name: Restore from private data repo
        if: ${{ vars.DATA_REPO != '' }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO: ${{ vars.DATA_REPO }}
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" private-data
          mkdir -p data
          restored=0
          if [ -d private-data/data ]; then
            while IFS= read -r -d '' f; do
              rel="${f#private-data/data/}"
              if [ ! -e "data/$rel" ]; then
                mkdir -p "data/$(dirname "$rel")"; cp "$f" "data/$rel"; restored=$((restored+1))
              fi
            done < <(find private-data/data -type f -print0)
          fi
          echo "Files restored from the private repo: $restored (the rest came from the cache)"

      - name: Fetch data and build dashboard
        env:
          # Secrets (Settings → Secrets and variables → Actions → Secrets)
          APP_ID: ${{ secrets.DEYE_APP_ID }}
          APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
          EMAIL: ${{ secrets.DEYE_EMAIL }}
          MOBILE: ${{ secrets.DEYE_MOBILE }}
          PASSWORD: ${{ secrets.DEYE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
          FAST2SMS_NUMBERS: ${{ secrets.FAST2SMS_NUMBERS }}
          # Optional plain settings (Settings → Secrets and variables → Actions → Variables)
          BASE_URL: ${{ vars.BASE_URL }}
          START_DATE: ${{ vars.START_DATE }}     # DD/MM/YYYY, optional
          DISPLAY_NAME: ${{ vars.DISPLAY_NAME }}
          THEME: ${{ vars.THEME }}
          STRING_PANELS: ${{ vars.STRING_PANELS }}
          PARALLEL_STRINGS: ${{ vars.PARALLEL_STRINGS }}
          PANEL_WATTS: ${{ vars.PANEL_WATTS }}
          PANEL_VOLTS_HOT: ${{ vars.PANEL_VOLTS_HOT }}
          # Public-repo safety
          MASK_IDS: "1"                # hide plant name / IDs in these public logs
          HISTORY_CSV: data/solar_history.csv
          STRINGS_JSON: data/strings_history.json
          ALERT_STATE: data/alert_state.json
          OUTPUT_HTML: docs/index.html
          RUN_TIMES: "07:47,13:47,19:47"   # keep in step with the Worker / cron times (IST)
          # Morning update for residents (sent once, by the 8 AM run)
          COMMUNITY_NAME: ${{ vars.COMMUNITY_NAME }}
          UPDATE_TITLE: ${{ vars.UPDATE_TITLE }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          RESIDENT_TELEGRAM_CHAT: ${{ vars.RESIDENT_TELEGRAM_CHAT }}
          WEATHER_PLACE: ${{ vars.WEATHER_PLACE }}
          LATITUDE: ${{ vars.LATITUDE }}
          LONGITUDE: ${{ vars.LONGITUDE }}
          FORECAST_JSON: data/forecast_log.json
          UPDATE_TXT: data/resident_update.txt
          ALERTS_JSON: data/inverter_alerts.json
          FRAMES_DIR: data/frames
        run: python solar_chart.py --no-open

      - name: Save private history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: solar-data-${{ github.run_id }}

      - name: Back up data to private repo
        if: ${{ success() && vars.DATA_REPO != '' }}
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO: ${{ vars.DATA_REPO }}
        run: |
          [ -d private-data/.git ] || git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" private-data
          mkdir -p private-data/data
          cp -r data/. private-data/data/
          cd private-data
          git config user.name  "solar-bot"
          git config user.email "solar-bot@users.noreply.github.com"
          git add -f data            # -f: back up even if that repo has a .gitignore
          if git diff --cached --quiet; then
            echo "No changes to back up."
          else
            git commit --quiet -m "Backup $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')"
            git push --quiet
            echo "Backed up to the private repo."
          fi

      - name: Publish dashboard
        run: |
          git config user.name  "solar-bot"
          git config user.email "solar-bot@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Dashboard update $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')"
            # if you edited the repo while this ran, catch up first, then push (3 tries)
            for i in 1 2 3; do
              git pull --rebase --quiet origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
              echo "Push attempt $i didn't go through, retrying…"; sleep 5
            done
            echo "::error::Couldn't publish the dashboard — see the messages above."; exit 1
          fi
